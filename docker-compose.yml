services:
  app:
    build: .
    restart: always
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./vault:/app/vault
